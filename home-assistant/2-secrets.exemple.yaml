# À AJOUTER dans secrets.yaml (même dossier que configuration.yaml).
# Remplacez <JETON> par le jeton de la liste des postes. Pour l'obtenir sur votre PC, dans PowerShell :
#
#     cd "<DOSSIER_DU_PROJET>"
#     .\Pg20-Technicien-Configurer.ps1 -ShowFeedToken
#
# Le mot "Bearer" suivi d'un espace doit rester devant le jeton.
pg20_feed_bearer: "Bearer <JETON>"
