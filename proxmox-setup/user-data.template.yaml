#cloud-config
# Première configuration de la VM pg20-info (Debian 12) : compte admin, Docker, Cockpit, mises à jour auto.
# __HASH__ et __SSHKEY__ sont remplacés par 02-vm.sh.
hostname: pg20-info
manage_etc_hosts: true
timezone: Europe/Zurich

users:
  - name: pg20admin
    gecos: Pg20 Info admin
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: false
    passwd: "__HASH__"
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - __SSHKEY__

ssh_pwauth: false      # SSH uniquement par clé ; le mot de passe sert à la console Proxmox et à Cockpit
disable_root: true

write_files:
  - path: /usr/local/sbin/pg20-bootstrap.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get -y upgrade
      apt-get -y install qemu-guest-agent ca-certificates curl nftables unattended-upgrades cockpit
      systemctl enable --now qemu-guest-agent
      # Docker : dépôt officiel (méthode documentée par Docker)
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
      apt-get update
      apt-get -y install docker-ce docker-ce-cli containerd.io docker-compose-plugin
      systemctl enable --now docker
      systemctl enable --now cockpit.socket
      printf 'APT::Periodic::Update-Package-Lists "1";\nAPT::Periodic::Unattended-Upgrade "1";\n' > /etc/apt/apt.conf.d/20auto-upgrades
      touch /var/lib/pg20-bootstrap.done

runcmd:
  - [bash, -c, "/usr/local/sbin/pg20-bootstrap.sh >> /var/log/pg20-bootstrap.log 2>&1"]
